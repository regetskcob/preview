name: Preview
# Builds a branch of regetskcob.github.io with its "preview" environment and
# publishes it as this repository's Pages project site, which the user site's
# domain serves under https://www.regetskcob.de/preview/. Started by hand:
#   gh workflow run preview.yml --repo regetskcob/preview -f ref=<branch>
# Without a ref the preview is parked: every address under /preview/ sends
# the visitor to the same page on the live site (job "park").
#   gh workflow run preview.yml --repo regetskcob/preview
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of regetskcob.github.io; empty parks the preview
        required: false
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: inputs.ref != ''
    runs-on: ubuntu-latest
    # A first run without the image cache renders every WebP of the blog from
    # scratch and takes far longer than the blog's own cached build.
    timeout-minutes: 60
    env:
      # Same versions as the blog's own workflow.
      GO_VERSION: 1.25.3
      HUGO_VERSION: 0.154.5
      TZ: Europe/Berlin
    steps:
      - name: Checkout the blog
        uses: actions/checkout@v7
        with:
          repository: regetskcob/regetskcob.github.io
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"
      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      # The base URL is fixed: Pages reports it as http://, and with
      # canonifyURLs every stylesheet and image would then load over http
      # and be blocked on the https page.
      - name: Build the preview
        run: |
          git config core.quotepath false
          hugo --gc --minify --environment preview --baseURL "https://www.regetskcob.de/preview/" --cacheDir "${{ runner.temp }}/hugo_cache"
      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      - name: Build the search index
        run: npx -y pagefind@1.5.2 --site public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  # The parked preview: one page, served for every address as index and 404,
  # that strips /preview from the path and moves on to the live site.
  # noindex, so search engines drop what they still had of the preview.
  park:
    if: inputs.ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the redirect page
        run: |
          mkdir -p public
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="de">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex">
          <title>Vorschau pausiert | regetskcob</title>
          <meta http-equiv="refresh" content="0; url=https://www.regetskcob.de/">
          <script>location.replace("https://www.regetskcob.de" + (location.pathname.replace(/^\/preview/, "") || "/") + location.hash)</script>
          </head>
          <body>
          <p>Gerade gibt es keine Vorschau. Weiter zu <a href="https://www.regetskcob.de/">regetskcob.de</a>.</p>
          </body>
          </html>
          HTML
          cp public/index.html public/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
  deploy:
    # After whichever of build and park ran; the other one is skipped.
    if: always() && (needs.build.result == 'success' || needs.park.result == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, park]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
